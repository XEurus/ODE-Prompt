DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
    BATCH_EMBEDDING_SIZE: 32
  TEST:
    BATCH_SIZE: 32
  NUM_WORKERS: 16

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

# OPTIM:
#   NAME: "sgd"
#   LR: 0.002
#   MAX_EPOCH: 80
#   LR_SCHEDULER: "cosine"
#   WARMUP_EPOCH: 5
#   WARMUP_TYPE: "constant"
#   WARMUP_CONS_LR: 1e-5
# OPTIM:
#   NAME: "sgd"
#   LR: 0.0001
#   MAX_EPOCH: 80
#   LR_SCHEDULER: "plateau"
#   PLATEAU_MODE: "min"
#   PLATEAU_FACTOR: 0.1
