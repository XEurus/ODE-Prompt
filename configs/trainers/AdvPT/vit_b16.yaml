#   PLATEAU_THRESHOLD: 1e-4
#   PLATEAU_MIN_LR: 1e-6
#   WARMUP_EPOCH: -1  # plateau 不支持 warmup

OPTIM:
  NAME: "adamw"
  LR: 0.0005
  MAX_EPOCH: 40
  LR_SCHEDULER: "plateau"
  PLATEAU_MODE: "min"
  PLATEAU_FACTOR: 0.1
  PLATEAU_PATIENCE: 4
  PLATEAU_THRESHOLD: 1e-4
  PLATEAU_MIN_LR: 1e-7
  WARMUP_EPOCH: -1  # plateau 不支持 warmup

TRAIN:
  PRINT_FREQ: 5
  CHECKPOINT_FREQ: 10  # 每10个epoch保存一次检查点
  MIX_CLEAN_RATIO: 0.5  # 干净数据混合比例 (0.0=纯对抗, 1.0=纯干净, 0.5=各50%)

TEST:
  NO_TEST: False
  FINAL_MODEL: "best_val"  # 启用每个epoch的测试
  SPLIT: "test"
  EPOCH_TEST_BATCHES: 10  # 每个epoch测试的batch数量

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"